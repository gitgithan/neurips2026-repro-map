[project]
name = "neurips2026-repro-map"
version = "0.1.0"
description = "Evidence map of the NeurIPS 2026 reproduction-hackathon claim list: what each paper links to and what its repository looks like, before you commit to it."
requires-python = ">=3.11"
dependencies = ["datasets>=3.0", "httpx>=0.27", "numpy>=1.26", "pymupdf>=1.24"]

[dependency-groups]
embed = ["sentence-transformers>=3.0", "umap-learn>=0.5.6", "scikit-learn>=1.4"]
